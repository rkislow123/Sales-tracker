<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sales Tracker Taman Griya - Cloud Sync</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    
<div id="loginScreen" class="modal" style="display: flex; background-color: #020617; z-index: 1000; height: 100vh;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🔐 Sales Tracker</h2>
            <p>
                Silakan login untuk mengakses sistem
            </p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input
                type="text"
                id="login-user"
                class="form-control"
                placeholder="Username"
                required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                type="password"
                id="login-password"
                class="form-control"
                placeholder="••••••••"
                required
                >
            </div>

            <div id="login-error"></div>

            <button type="submit" id="btn-login" class="btn">Masuk Aplikasi</button>
        </form>
        <p style="margin-top: 15px; font-size: 0.9rem; color:black;">
        Belum punya akun? <a href="#" id="show-register">Daftar di sini</a>
        </p>
    </div>
</div>

<div id="register-box" class="modal" style="display: none; background-color: #020617; z-index: 1000; height: 100vh;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Daftar Akun Baru</h2>
        </div>
        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-email" class="form-control" placeholder="Contoh: kasir1" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" class="form-control" placeholder="Minimal 6 karakter" required>
            </div>
            <button type="submit" class="btn">Daftar Akun</button>
        </form>
        <p style="margin-top: 15px; font-size: 0.9rem;">
            Sudah punya akun? <a href="#" id="show-login">Login di sini</a>
        </p>
    </div>
</div>

<script src="config.js"></script>
<script>

    // Event Listener Form Login
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('login-user').value;
        const password = document.getElementById('login-password').value;
        const errorDiv = document.getElementById('login-error');
        const btnLogin = document.getElementById('btn-login');
        const email = username + '@tamangriya.sat';

        errorDiv.style.display = 'none';
        btnLogin.innerText = 'Memproses...';
        btnLogin.disabled = true;

        // Proses Login Firebase
        firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
            // Login sukses
            btnLogin.innerText = 'Masuk Aplikasi';
            btnLogin.disabled = false;
            window.location.replace("index.html");

        })
        .catch((error) => {
            // Gagal login
            btnLogin.innerText = 'Masuk Aplikasi';
            btnLogin.disabled = false;
            errorDiv.style.display = 'block';
            errorDiv.innerText = 'Email atau Password salah!';
        });
    });

    // Listener Form Registrasi
    const registerForm = document.getElementById('register-form');

    if (registerForm) {
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const username = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const email = username + '@tamangriya.sat';

            // Panggil SDK Firebase Auth untuk Registrasi
            firebase.auth().createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                // Berhasil mendaftar
                const user = userCredential.user;
                Swal.fire({
                    title: 'Registrasi Sukses!',
                    color: '#fff',
                    background: '#1F2937',
                    html: '<span style="color: #9CA3AF"> Kamu akan di arahkan ke Dashboard...</span>',
                    icon: 'success',
                    iconColor: '#10B981',
                    timer: 2000, 
                    timerProgressBar: true,
                    showConfirmButton: false,
                    didOpen: () => {
                        const progressBar = Swal.getTimerProgressBar();
                        if (progressBar) {
                            progressBar.style.backgroundColor = '#10B981';
                        }
                    }
                }).then(() => {
                    window.location.href = 'index.html';
                });

            })
            .catch((error) => {
                // Penanganan error (misal email sudah terpakai / password kurang dari 6 karakter)
                const errorCode = error.code;
                const errorMessage = error.message;

                if (errorCode === 'auth/email-already-in-use') {
                    alert('Error: Email ini sudah terdaftar!');
                } else if (errorCode === 'auth/weak-password') {
                    alert('Error: Password minimal 6 karakter!');
                } else {
                    alert('Gagal Registrasi: ' + errorMessage);
                }
            });
        });
    }
    
    const loginBox = document.getElementById('loginScreen');
    const registerBox = document.getElementById('register-box');
    
    document.getElementById('show-register')?.addEventListener('click', (e) => {
      e.preventDefault();
      loginBox.style.display = 'none';
      registerBox.style.display = 'flex';
    });
    
    document.getElementById('show-login')?.addEventListener('click', (e) => {
      e.preventDefault();
      registerBox.style.display = 'none';
      loginBox.style.display = 'flex';
    });

    
    </script>
</body>
</html>
