<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sales Tracker Taman Griya</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    
<div id="loginScreen" class="modal" style="display: flex; background-color: #020617; z-index: 1000; height: 100vh;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🔐 Sales Tracker</h2>
            <p>
                Silakan login untuk mengakses sistem
            </p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input
                type="text"
                id="login-user"
                class="form-control"
                placeholder="Username"
                required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                type="password"
                id="login-password"
                class="form-control"
                placeholder="••••••••"
                required
                >
            </div>

            <div id="login-error"></div>

            <button type="submit" id="btn-login" class="btn">Masuk Aplikasi</button>
        </form>
    </div>
</div>

<script src="config.js"></script>
<script>

    // Event Listener Form Login
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('login-user').value;
        const password = document.getElementById('login-password').value;
        const errorDiv = document.getElementById('login-error');
        const btnLogin = document.getElementById('btn-login');
        const email = username + '@sat.co.id';

        errorDiv.style.display = 'none';
        btnLogin.innerText = 'Memproses...';
        btnLogin.disabled = true;

        // Proses Login Firebase
        firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
            // Login sukses
            btnLogin.innerText = 'Masuk Aplikasi';
            btnLogin.disabled = false;
            window.location.replace("index.html");

        })
        .catch((error) => {
            // Gagal login
            btnLogin.innerText = 'Masuk Aplikasi';
            btnLogin.disabled = false;
            errorDiv.style.display = 'block';
            errorDiv.innerText = 'Email atau Password salah!';
        });
    });
    
    </script>
</body>
</html>
